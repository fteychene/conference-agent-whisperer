CONSTANTS
    Procs   = {p1, p2}
    Amount  = 6
    Initial = 10

SPECIFICATION Spec
INVARIANT NoOverdraft

\* Both processes legitimately finish (reach "done"), which leaves a state with
\* no successors. That is intended TERMINATION, not a deadlock — so tell TLC not
\* to flag it. (Without this, TLC's default deadlock check reports a false alarm
\* even though the invariant holds.)
CHECK_DEADLOCK FALSE
