<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Agent Whisperer — talk versions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --tey-navy: #0b1a24;
      --tey-navy-2: #142e3d;
      --tey-teal: #0f9d8f;
      --tey-paper: #ffffff;
      --tey-mist: #f4f6f7;
      --r-main-font: -apple-system, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 1.5rem;
      background: var(--tey-navy);
      background-image: linear-gradient(180deg, rgba(11, 26, 36, 0.85), rgba(11, 26, 36, 0.96)),
        url("commit2026/assets/atmosphere/marble-blue.jpg");
      background-size: cover;
      background-position: center;
      color: var(--tey-paper);
      font-family: var(--r-main-font);
    }

    header {
      text-align: center;
      max-width: 40rem;
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 300;
      margin: 0 0 0.5rem;
    }

    header p {
      margin: 0;
      color: var(--tey-mist);
      opacity: 0.8;
      font-size: 1rem;
    }

    ul.versions {
      list-style: none;
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 30rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    ul.versions li a {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--tey-paper);
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    ul.versions li a:hover,
    ul.versions li a:focus {
      background: rgba(15, 157, 143, 0.18);
      border-color: var(--tey-teal);
    }

    ul.versions .version-name {
      font-size: 1.1rem;
      font-weight: 600;
    }

    ul.versions .version-date {
      font-size: 0.85rem;
      color: var(--tey-mist);
      opacity: 0.75;
      white-space: nowrap;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: var(--tey-mist);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>The Agent Whisperer</h1>
    <p>Different runs of the same talk, one per event — pick a version below.</p>
  </header>

  <ul class="versions">
    <li>
      <a href="commit2026/index.html">
        <span class="version-name">Le Commit 2026</span>
        <span class="version-date">21 sept. 2026</span>
      </a>
    </li>
  </ul>

  <footer>@fteychene</footer>
</body>
</html>
